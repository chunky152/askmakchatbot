<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Verify Email - AskMak</title>
  <link rel="icon" href="/favicon.png" type="image/png" sizes="any">
  <meta name="theme-color" content="#006B3C">
  <meta name="color-scheme" content="light dark">
  <script>
    (function () {
      try {
        var k = localStorage.getItem('askmak-theme');
        var dark =
          k === 'dark'
            ? true
            : k === 'light'
              ? false
              : typeof matchMedia !== 'undefined' && matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', !!dark);
      } catch (e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-page relative font-sans bg-transparent text-gray-900 dark:text-zinc-100 min-h-dvh flex flex-col pb-[env(safe-area-inset-bottom,0px)]">

  <div class="home-chatbot-bg" aria-hidden="true">
    <div class="home-chatbot-bg__mesh"></div>
    <div class="home-chatbot-bg__grid"></div>
    <div class="home-chatbot-bg__orb home-chatbot-bg__orb--1"></div>
    <div class="home-chatbot-bg__orb home-chatbot-bg__orb--2"></div>
  </div>

  <header class="relative z-10 shrink-0 pt-[max(0px,env(safe-area-inset-top,0px))]">
    <div class="max-w-md mx-auto w-full px-4 sm:px-5 pt-4 flex items-center">
      <a href="/" class="group inline-flex items-center gap-2 rounded-lg pl-1.5 pr-2.5 py-2 text-sm font-medium text-gray-600 hover:text-mak-dark dark:text-gray-400 dark:hover:text-white transition">
        <span class="inline-flex h-8 w-8 items-center justify-center rounded-lg bg-white/90 text-gray-500 shadow-sm ring-1 ring-gray-200/80 group-hover:text-mak-green group-hover:ring-mak-green/30 dark:bg-gray-900/80 dark:text-gray-400 dark:ring-gray-700 dark:group-hover:text-mak-green transition">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        </span>
        <span>Home</span>
      </a>
    </div>
  </header>

  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-8">
    <div class="w-full max-w-md">
      <div class="text-center mb-6 sm:mb-8">
        <div class="flex flex-col items-center gap-2 mb-3">
          <img src="/assets/askmak%20logo%20lightmode.png" alt="AskMak" class="h-12 sm:h-14 w-auto max-w-[min(100%,14rem)] object-contain mx-auto dark:hidden" width="200" height="56" decoding="async" />
          <img src="/assets/askmak%20logo%20darkmode.png" alt="AskMak" class="h-12 sm:h-14 w-auto max-w-[min(100%,14rem)] object-contain mx-auto hidden dark:block" width="200" height="56" decoding="async" />
          <p class="text-[11px] sm:text-xs font-medium text-gray-500 dark:text-zinc-400 tracking-wide">Intelligent Campus Assistant</p>
        </div>
        <div class="w-14 h-14 rounded-full bg-mak-green/10 text-mak-green flex items-center justify-center mx-auto my-4">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        </div>
        <p class="text-sm text-gray-600 dark:text-zinc-400 px-1 leading-snug max-w-sm mx-auto">Enter the 6-digit code printed in the terminal where the AskMak server is running (or from your email if email verification is enabled).</p>
        <p id="verify-notice" class="hidden mt-3 text-xs text-gray-600 dark:text-zinc-400 text-center leading-relaxed px-1"></p>
      </div>

      <div class="rounded-2xl border border-gray-200/90 dark:border-gray-700/90 bg-white/90 dark:bg-gray-900/85 backdrop-blur-xl shadow-xl p-5 sm:p-7 ring-1 ring-white/60 dark:ring-white/[0.06]">
        <div id="alert" class="hidden"></div>

        <form id="verify-form" class="space-y-4">
          <div class="space-y-1">
            <label for="code" class="block text-sm font-medium text-gray-700 dark:text-gray-300">Verification code</label>
            <input type="text" name="code" id="code" placeholder="000000" required maxlength="6" inputmode="numeric" autocomplete="one-time-code"
              class="w-full px-3.5 py-3 min-h-[48px] border border-gray-200 dark:border-gray-700 rounded-xl text-lg sm:text-lg font-semibold bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus:border-mak-green focus:ring-2 focus:ring-mak-green/10 transition text-center tracking-[0.3em]">
          </div>

          <button type="submit" class="w-full min-h-[44px] bg-mak-green text-white py-3 rounded-xl text-sm font-semibold hover:opacity-90 transition cursor-pointer touch-manipulation">
            Verify email
          </button>
        </form>

        <div class="text-center mt-4">
          <button id="resend-btn" class="text-sm min-h-[44px] px-2 text-gray-500 dark:text-gray-400 hover:text-mak-green dark:hover:text-mak-green transition bg-transparent border-none cursor-pointer touch-manipulation">
            Resend Code
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>Auth.setupForms();</script>
</body>
</html>
