    <main id="admin-main" class="flex-1 min-h-0 min-w-0 overflow-y-auto thin-scroll overflow-x-auto p-3 sm:p-4 md:p-5"></main>
  </div>
</div>

<div id="admin-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 pb-[env(safe-area-inset-bottom,0px)] sm:pb-4 bg-black/50">

    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-800 shrink-0 bg-emerald-50/50 dark:bg-mak-green/5">
      <h3 id="modal-title" class="font-semibold text-mak-dark dark:text-white"></h3>
      <button type="button" id="modal-close" class="text-2xl leading-none text-gray-400 hover:text-mak-green dark:hover:text-mak-green border-none bg-transparent cursor-pointer">&times;</button>
    </div>
    <div id="modal-body" class="p-4 overflow-y-auto thin-scroll flex-1 text-sm"></div>
  </div>
</div>
